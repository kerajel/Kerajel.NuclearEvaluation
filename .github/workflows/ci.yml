name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Local_Dev_Pass_123"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Local_Dev_Pass_123 -C -Q 'SELECT 1' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=20s

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Kerajel.NuclearEvaluation.sln

      - name: Build
        run: dotnet build Kerajel.NuclearEvaluation.sln --configuration Release --no-restore

      - name: Test
        env:
          NUCLEAR_TEST_SQL: "Server=localhost;User Id=sa;Password=Local_Dev_Pass_123;TrustServerCertificate=True"
        run: dotnet test Kerajel.NuclearEvaluation.sln --configuration Release --no-build --verbosity normal

  browser-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Run browser suite
        run: ./scripts/run-e2e.sh

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
